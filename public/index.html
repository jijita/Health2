<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<title>Mon journal IA</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#171717;--muted:#6b7280;--border:#e5e7eb;--soft:#f1f5f9;--accent:#111827;--warn:#92400e;--ok:#166534}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:720px;margin:auto;padding:18px 14px 55px}h1{font-size:27px;margin:3px 0}.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--soft);border-radius:14px;padding:14px}.metric b{display:block;font-size:28px}
textarea,input,select,button{font:inherit}textarea,input,select{width:100%;border:1px solid var(--border);border-radius:13px;padding:12px;background:#fff}
textarea{min-height:125px;resize:vertical}.btn{border:0;border-radius:13px;padding:13px 15px;background:var(--accent);color:white;font-weight:750;cursor:pointer}
.btn.secondary{background:var(--soft);color:var(--text)}.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.status{font-size:13px;color:var(--muted);margin-top:9px}
.entry{padding:12px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:10px}.entry:last-child{border-bottom:0}
.name{font-weight:700}.meta{font-size:13px;color:var(--muted)}.kcal{font-weight:800;text-align:right}.note{font-size:12px;color:var(--warn);margin-top:4px}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;background:#111827}
.airesult{margin-top:12px;padding:12px;border-radius:14px;background:var(--soft);display:none}.aiitem{padding:8px 0;border-bottom:1px solid #dfe3e8}.aiitem:last-child{border-bottom:0}
.small{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:18px}.ok{color:var(--ok)}
@media(max-width:520px){.row.stack-mobile{display:grid;grid-template-columns:1fr 1fr}.row.stack-mobile select{min-width:0}.row.stack-mobile button{min-width:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍽️ Mon journal IA</h1>
  <div class="sub">Écris simplement ce que tu as mangé. L’IA estime calories et protéines, puis tu confirmes.</div>

  <div class="card">
    <div class="metrics">
      <div class="metric"><span>Calories aujourd’hui</span><b id="totalKcal">0</b><span class="small">kcal</span></div>
      <div class="metric"><span>Protéines</span><b id="totalProtein">0</b><span class="small">g</span></div>
    </div>
    <div class="small" style="margin-top:12px">Objectif calories</div>
    <input id="goal" type="number" value="1600" min="800" max="4000" step="50">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="remaining" class="small" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <b>Qu’est-ce que tu as mangé ?</b>
    <textarea id="foodText" placeholder="Ex. Ce matin j’ai mangé une pita de 100 calories, une cuillère à café de mayo, une poignée de poulet, beaucoup de laitue et un café Nespresso."></textarea>
    <div class="row stack-mobile" style="margin-top:10px">
      <select id="meal">
        <option>Déjeuner</option><option>Dîner</option><option>Souper</option><option>Collation</option><option>Plusieurs repas</option>
      </select>
      <button class="btn" id="estimateBtn">✨ Estimer avec l’IA</button>
    </div>
    <div id="status" class="status"></div>
    <div id="aiResult" class="airesult"></div>
  </div>

  <div class="card">
    <b>Aujourd’hui</b>
    <div id="entries"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const day=()=>new Date().toLocaleDateString('en-CA');
const storageKey=()=> 'food_ai_'+day();
let entries=JSON.parse(localStorage.getItem(storageKey())||'[]');
let pending=[];
let goal=Number(localStorage.getItem('food_ai_goal')||1600);
$('goal').value=goal;

function save(){localStorage.setItem(storageKey(),JSON.stringify(entries))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
  const kcal=entries.reduce((s,e)=>s+Number(e.calories||0),0);
  const protein=entries.reduce((s,e)=>s+Number(e.protein_g||0),0);
  $('totalKcal').textContent=Math.round(kcal);
  $('totalProtein').textContent=Math.round(protein);
  $('bar').style.width=Math.min(100,kcal/goal*100)+'%';
  $('remaining').textContent=kcal<=goal?`${Math.round(goal-kcal)} kcal restantes sur ${goal}`:`${Math.round(kcal-goal)} kcal au-dessus de ${goal}`;
  $('entries').innerHTML=entries.length?entries.map((e,i)=>`
    <div class="entry">
      <div>
        <div class="name">${esc(e.name)}</div>
        <div class="meta">${esc(e.meal||'')} • ${Math.round(e.protein_g||0)} g protéines</div>
        ${e.note?`<div class="note">${esc(e.note)}</div>`:''}
      </div>
      <div>
        <div class="kcal">${Math.round(e.calories)} kcal</div>
        <button class="btn secondary" style="padding:6px 8px;margin-top:5px" onclick="del(${i})">Supprimer</button>
      </div>
    </div>`).join(''):'<div class="empty">Rien de logué pour le moment.</div>';
}
window.del=i=>{entries.splice(i,1);save();render()}
$('goal').onchange=()=>{goal=Number($('goal').value||1600);localStorage.setItem('food_ai_goal',goal);render()}

async function checkHealth(){
  try{
    const r=await fetch('/health',{cache:'no-store'});
    if(!r.ok) throw new Error();
    const x=await r.json();
    if(!x.aiConfigured){
      $('status').innerHTML='<span style="color:#b91c1c">La clé OpenAI n’est pas encore configurée sur le serveur.</span>';
    }
  }catch(e){}
}
checkHealth();

$('estimateBtn').onclick=async()=>{
  const text=$('foodText').value.trim();
  if(!text)return alert('Écris d’abord ce que tu as mangé.');
  $('estimateBtn').disabled=true;
  $('status').textContent='Estimation en cours…';
  $('aiResult').style.display='none';

  try{
    const r=await fetch('/api/estimate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,meal:$('meal').value})
    });
    let data={};
    try{data=await r.json()}catch{}
    if(!r.ok) throw new Error(data.error||`Erreur serveur (${r.status})`);

    pending=data.items||[];
    const total=pending.reduce((s,x)=>s+Number(x.calories||0),0);
    const protein=pending.reduce((s,x)=>s+Number(x.protein_g||0),0);

    $('aiResult').innerHTML=`
      <b>Estimation : ${Math.round(total)} kcal · ${Math.round(protein)} g protéines</b>
      ${pending.map(x=>`
        <div class="aiitem">
          <b>${esc(x.name)}</b> — ${Math.round(x.calories)} kcal · ${Math.round(x.protein_g||0)} g prot.
          ${x.note?`<div class="small">${esc(x.note)}</div>`:''}
        </div>`).join('')}
      <div class="row" style="margin-top:10px">
        <button class="btn" id="confirmBtn">✓ Ajouter au journal</button>
        <button class="btn secondary" id="cancelBtn">Modifier</button>
      </div>
      <div class="small" style="margin-top:8px">Estimation approximative : précise quantité, marque ou calories de l’emballage quand tu les connais.</div>`;
    $('aiResult').style.display='block';
    $('status').innerHTML='<span class="ok">Estimation terminée.</span>';

    $('confirmBtn').onclick=()=>{
      entries.push(...pending.map(x=>({...x,meal:$('meal').value,time:new Date().toISOString()})));
      save();render();pending=[];$('foodText').value='';$('aiResult').style.display='none';$('status').textContent='';
    };
    $('cancelBtn').onclick=()=>{$('aiResult').style.display='none';$('status').textContent='Modifie ton texte puis relance l’estimation.'};
  }catch(e){
    $('status').innerHTML='<span style="color:#b91c1c">Erreur : '+esc(e.message)+'</span>';
  }finally{
    $('estimateBtn').disabled=false;
  }
};
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body>
</html>
